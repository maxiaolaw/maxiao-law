    .map-section { position: relative; margin-bottom: 80px; }

      stroke-width: 0.6;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;

    .city-pin    { fill: #c9909e; transition: fill 0.2s; }

      font-family: 'Jost', sans-serif;
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      fill: #9a879f;
      transition: fill 0.2s;
      pointer-events: none;
      user-select: none;
    }
    .city-group:hover .city-label { fill: #7a5c8c; }

    .map-tooltip {
      position: absolute;
      background: rgba(253, 248, 244, 0.93);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid #e4d8ee;
      border-radius: 4px;
      padding: 14px 18px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      max-width: 240px;
      box-shadow: 0 4px 20px rgba(122, 92, 140, 0.08);
      z-index: 10;
    }
    .map-tooltip.visible { opacity: 1; }

    .tooltip-city-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: #2c2030;
      margin-bottom: 5px;
    }
    .tooltip-caption-text {
      font-size: 0.82rem;
      color: #9a879f;
      line-height: 1.7;
      font-style: italic;
    }

  </style>

  <script>
    (function () {
      var cities = {
        beijing:  { name: 'Beijing',           caption: 'It unsettled me first, then shaped me. I found myself somewhere between the hutongs and the concert halls.' },
        hangzhou: { name: 'Hangzhou',          caption: 'Where I am from. If I could choose, I would return here under the Southern Song, with tea and poetry.' },
        shanghai: { name: 'Shanghai',          caption: 'Friends, mentors, the earliest career lessons. It gave me a sense of steadiness, and my first taste of practicing law in China.' },
        hongkong: { name: 'Hong Kong',         caption: 'A place I return to in my mind. The friends and colleagues here understand me in a particular way.' },
        london:   { name: 'London',            caption: 'A short summer. A busy life in the city — like a little fish leaping into the ocean.' },
        oxford:   { name: 'Oxford',            caption: 'It drew me toward the academic life. The quiet and the deep calm here cultivated my sense of independence.' },
        boston:   { name: 'Boston',            caption: 'I am still learning how to belong. Every room I walk into reminds me how much I have yet to know.' },
        newhaven: { name: 'New Haven',         caption: 'The Covid years, a small town, and the beginning of motherhood.' },
        dc:       { name: 'Washington, D.C.',  caption: 'Where something in me began to dream. I still miss the summers at Wolf Trap.' },
        dallas:   { name: 'Dallas',            caption: 'Family life, unhurried — a kindness that asks for nothing in return.' }
      };

      var section  = document.getElementById('mapSection');
      var tooltip  = document.getElementById('mapTooltip');
      var nameEl   = document.getElementById('tooltipCityName');
      var captEl   = document.getElementById('tooltipCaptionText');

      document.querySelectorAll('.city-group').forEach(function (g) {
        var d = cities[g.dataset.city];
        if (!d) return;

        g.addEventListener('mouseenter', function () {
          nameEl.textContent = d.name;
          captEl.textContent = d.caption;
          tooltip.classList.add('visible');
        });

        g.addEventListener('mousemove', function (e) {
          var r   = section.getBoundingClientRect();
          var x   = e.clientX - r.left + 16;
          var y   = e.clientY - r.top  - 8;
          if (x + 252 > r.width) x = e.clientX - r.left - 268;
          if (y < 4) y = 4;
          tooltip.style.left = x + 'px';
          tooltip.style.top  = y + 'px';
        });

        g.addEventListener('mouseleave', function () {
          tooltip.classList.remove('visible');
        });
      });
    })();
  </script>
